<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sunny Cove startup checks</title></head>
<body>
  <canvas id="world"></canvas>
  <span id="clock"></span><span id="weather"></span><span id="mood-label"></span>
  <button id="pause" data-ready><span id="pause-icon"></span><span id="pause-label"></span></button>
  <button id="sound" data-ready><span id="sound-label"></span></button>
  <select id="camera" data-ready></select><span id="shot-name"></span>
  <button data-mood="afternoon" data-ready>Day</button>
  <span id="boat-name"></span><span id="boat-phase"></span>
  <div id="loading"><span id="loader"></span><span id="load-text"></span><button id="retry" hidden>Retry</button></div>
  <div id="toast" hidden></div><button id="immerse" data-ready>Immerse</button><button id="capture" data-ready>Capture</button>
  <button id="restore" hidden>Restore</button><button id="credits-open">Credits</button>
  <dialog id="credits-dialog"><button id="credits-close">Close</button><div id="credits-list"></div></dialog>
  <script type="module" src="./startup-browser.mjs"></script>
</body>
</html>
